#### preseed.cfg
#### Instalação automatizada Debian - Laboratório com integração AD
#### Baseado em Debian 12 (Bookworm) netinst amd64

########################################
### Localização / Idioma / Teclado
########################################
d-i debian-installer/locale string pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i localechooser/supported-locales multiselect pt_BR.UTF-8, en_US.UTF-8

########################################
### Rede
########################################
d-i netcfg/choose_interface select auto
# d-i netcfg/get_hostname string debian-lab
# d-i netcfg/get_domain string seudominio.local
# d-i netcfg/wireless_wep string

# ATENÇÃO: se o DHCP não entregar o DNS do AD automaticamente,
# descomente e ajuste as linhas abaixo para forçar o DNS correto,
# senão o "realm discover" no join AD vai falhar.
# d-i netcfg/disable_dhcp boolean true
# d-i netcfg/get_ipaddress string 192.168.1.50
# d-i netcfg/get_netmask string 255.255.255.0
# d-i netcfg/get_gateway string 192.168.1.1
# d-i netcfg/get_nameservers string 192.168.1.10
# d-i netcfg/confirm_static boolean true

########################################
### Espelho (mirror)
########################################
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

########################################
### Conta de root / usuário local
########################################
# Login via AD é o método principal, mas mantemos um root local
# para administração/recuperação de emergência.
d-i passwd/root-login boolean true
d-i passwd/root-password password __ROOT_PASSWORD__
d-i passwd/root-password-again password __ROOT_PASSWORD__

# Usuário local de suporte (opcional - pode remover se só quiser login AD)
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Suporte Lab
d-i passwd/username string suporte
d-i passwd/user-password password __SUPORTE_PASSWORD__
d-i passwd/user-password-again password __SUPORTE_PASSWORD__
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

########################################
### Fuso horário / Relógio
########################################
# NTP é essencial: Kerberos (usado no AD) falha com relógio dessincronizado.
d-i clock-setup/utc boolean true
d-i time/zone string America/Sao_Paulo
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string a.st1.ntp.br

########################################
### Particionamento
########################################
# Guiado, disco inteiro, layout único (ajuste se quiser LVM/partições separadas)
# d-i partman-auto/method string regular
# d-i partman-auto/choose_recipe select atomic
# d-i partman/choose_partition select finish

# Confirmacoes de particionamento propositalmente NAO preseedadas: mesmo
# com priority=critical, essas perguntas sao criticas por padrao e o
# instalador vai parar e pedir validacao manual do usuario antes de
# gravar o novo layout de particoes / apagar dados no disco.
#d-i partman-partitioning/confirm_write_new_label boolean true
#d-i partman/confirm boolean true
#d-i partman/confirm_nooverwrite boolean true
#d-i partman-md/confirm boolean true
#d-i partman-md/confirm_nooverwrite boolean true
#d-i partman-partitioning/confirm_new_label boolean true

########################################
### APT
########################################
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

########################################
### Seleção de pacotes (tasksel)
########################################
# Não usamos task "desktop" completa (traz GNOME e pacotes desnecessários
# para um laboratório enxuto). Instalamos X11 + i3 manualmente via pkgsel/include.
# LightDM faz o login gráfico com lista de usuários (AD ou local).
#
# IMPORTANTE: por padrão o instalador ativa "APT::Install-Recommends" no
# sistema final, entao QUALQUER pacote acima (ex: network-manager-gnome,
# packagekit, lightdm-gtk-greeter) pode puxar em cascata os "Recommends"
# dele, e os Recommends desses, etc. Na pratica isso puxou GNOME inteiro
# (nautilus, firefox-esr, libreoffice, players de midia) mesmo sem
# selecionar nenhuma task de desktop. As duas linhas abaixo cortam isso:
d-i base-installer/install-recommends boolean false
d-i pkgsel/language-pack-patterns string

tasksel tasksel/first multiselect standard, ssh-server

d-i pkgsel/include string \
    sssd sssd-tools sssd-ad sssd-krb5 realmd adcli krb5-user samba-common-bin oddjob oddjob-mkhomedir packagekit \
    xserver-xorg xserver-xorg-video-intel xinit lightdm lightdm-gtk-greeter i3 i3status i3lock dmenu feh picom rofi \
    fonts-font-awesome fonts-dejavu fonts-noto \
    pulseaudio pulseaudio-utils pavucontrol \
    network-manager network-manager-gnome \
    firmware-linux firmware-misc-nonfree intel-microcode mesa-vulkan-drivers \
    build-essential gcc g++ gdb make git \
    python3 python3-pip python3-venv pipx python-is-python3 \
    golang-go \
    default-jdk \
    kitty chromium nano neovim diffutils \
    sudo curl wget zip unzip unrar htop tmux vim tree xclip \
    ca-certificates gnupg lsb-release

d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select unattended-upgrades
popularity-contest popularity-contest/participate boolean false

########################################
### GRUB
########################################
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

########################################
### Finalização
########################################
d-i finish-install/reboot_in_progress note

########################################
### Pós-instalação (late_command)
########################################
# Aqui deixamos preparado o essencial. O JOIN no AD propriamente dito
# fica em um script separado (join-ad.sh) rodando no primeiro boot,
# pois nesse estágio do installer a rede/DNS pode ainda não estar 100% estável.
d-i preseed/late_command string \
    echo 'AD_DOMAIN=__AD_DOMAIN__' >> /target/etc/environment; \
    in-target /bin/bash -c "echo '%suporte ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers.d/suporte && chmod 440 /etc/sudoers.d/suporte"; \
    in-target /bin/bash -c "echo 'ALL ALL=(root) NOPASSWD: /usr/sbin/poweroff, /usr/sbin/reboot, /usr/sbin/halt, /usr/sbin/shutdown, /usr/bin/systemctl poweroff, /usr/bin/systemctl reboot, /usr/bin/systemctl halt' > /etc/sudoers.d/power-management && chmod 440 /etc/sudoers.d/power-management"; \
    in-target /bin/bash -c "systemctl set-default graphical.target"; \
    in-target /bin/bash -c "echo 'exec i3' > /etc/skel/.xinitrc"; \
    in-target /bin/bash -c "mkdir -p /etc/skel/.config/i3"; \
    in-target /bin/bash -c "cp /etc/i3/config /etc/skel/.config/i3/config"; \
    in-target /bin/bash -c "sed -i 's/^set \$mod Mod1/set \$mod Mod4/' /etc/skel/.config/i3/config"; \
    in-target /bin/bash -c "printf '\n# Remove bordas de todas as janelas (tiling e flutuantes)\ndefault_border none\ndefault_floating_border none\n\n# Abrir kitty automaticamente em tela cheia, sem bordas, na workspace 1\n# (apenas essa instancia especifica - outras janelas kitty abrem normalmente)\nexec --no-startup-id kitty --title login-fullscreen\nfor_window [title=\"login-fullscreen\"] move to workspace 1\nfor_window [title=\"login-fullscreen\"] fullscreen enable\nfor_window [title=\"login-fullscreen\"] border none\n' >> /etc/skel/.config/i3/config"; \
    in-target /bin/bash -c "mkdir -p /etc/skel/.config/kitty"; \
    in-target /bin/bash -c "echo 'font_size 12.0' > /etc/skel/.config/kitty/kitty.conf"; \
    in-target /bin/bash -c "mkdir -p /home/suporte/.config/i3 /home/suporte/.config/kitty"; \
    in-target /bin/bash -c "cp /etc/skel/.xinitrc /home/suporte/.xinitrc"; \
    in-target /bin/bash -c "cp /etc/skel/.config/i3/config /home/suporte/.config/i3/config"; \
    in-target /bin/bash -c "cp /etc/skel/.config/kitty/kitty.conf /home/suporte/.config/kitty/kitty.conf"; \
    in-target /bin/bash -c "chown -R suporte:suporte /home/suporte/.xinitrc /home/suporte/.config"; \
    cp /cdrom/join-ad.sh /target/usr/local/sbin/join-ad.sh; \
    in-target chmod +x /usr/local/sbin/join-ad.sh; \
    cp /cdrom/install-extra.sh /target/usr/local/sbin/install-extra.sh; \
    in-target chmod +x /usr/local/sbin/install-extra.sh; \
    for i in 1 2 3 4 5; do cp /cdrom/logisim-evolution.deb /target/tmp/logisim-evolution.deb && break; sleep 3; done; \
    in-target /bin/bash -c "if [ -f /tmp/logisim-evolution.deb ]; then apt-get install -y /tmp/logisim-evolution.deb && rm -f /tmp/logisim-evolution.deb; else echo 'logisim-evolution.deb nao foi copiado de /cdrom apos 5 tentativas' > /var/log/logisim-install-failed.log; fi"; \
    in-target ln -sf /opt/logisim-evolution/bin/logisim-evolution /usr/local/bin/logisim-evolution
